name: README cards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_readme_cards.py"
      - "scripts/fetch_data.py"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contributions and featured repo stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render README cards (hero, tiles, activity, repos, contribution graph)
        run: python scripts/render_readme_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "Refresh README cards"
            git push
          fi
