  .month { font: 600 10.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .06em; fill: #7dd3fc; }
  .title { font: 700 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e8f1ff; }
  .sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #93a4c3; }
  .track { fill: none; stroke: url(#trk); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1000; stroke-dashoffset: 0; animation: draw 2.6s cubic-bezier(.6,.1,.2,1) both; }
  .track.second { animation-delay: .9s; }
  .gap { fill: none; stroke: #3b4f7a; stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
  .stn { animation: pop .5s ease-out both; }
  .pulse { fill: #38bdf8; opacity: .35; transform-box: fill-box; transform-origin: center;
            animation: pulse 2.2s ease-out 3.4s infinite; }
  @keyframes draw { from { stroke-dashoffset: 1000; } }
  @keyframes pop { from { opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .track, .stn, .pulse, .cursor { animation: none; } }
</style>
