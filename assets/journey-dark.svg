<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="t d">
<title id="t">Roushan Sharma, journey from 2021 to 2026</title>
<desc id="d">Jul 2021: First webpage, The World of Games, published online; Sep 2021: First React app, a Star Wars API explorer; Oct 2021: Hacktoberfest, plus Ranckin, a JEE mentoring site; Dec 2021: React + Firebase, Cooking Ninja, myMoney, The Management; Feb 2022: Str-atom, atoms in pure CSS, and my portfolio; Jun–Aug 2025: Scaler YIIC, Certificate of Excellence; Aug 2025: IIIT Bhubaneswar, B.Tech CSE, batch of 2025–29; Nov 2025: Google Cloud, Compute skill badge; Jan 2026: Clash of Minds, a local AI debate arena on Llama 3.2; Aug 2026: Adobe hackathon, cleared the DSA + SQL online round; Aug–Sep 2026: Rechitta, a landing page for a client; Oct 2026: Lajjha, real-time 3D jewellery in React + Three.js; Oct 2026: Urasicous, a solar microgrid control room; Now: What's next?, let's build something together</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081226"/><stop offset="1" stop-color="#0a0b17"/></linearGradient>
  <linearGradient id="trk" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="800"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
</defs>
<style>
