<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">The Management: A project-management app for small teams.</title>
<desc id="d">Sign up with a profile photo, saved to Firebase Storage. Projects with a category, due date and assigned teammates. Public and private projects, filtered by all, mine or private. A comment thread on every project. A live list of who's online right now.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
</defs>
<style>
  .eyebrow { font: 600 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .12em; fill: #0369a1; }
  .title { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #0c1a2e; letter-spacing: -.01em; }
  .sub { font: 400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4a5d78; }
  .feat { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #0c1a2e; }
  .lane { font: 600 10px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .14em; fill: #4a5d78; }
  .chip { font: 500 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #0b3a66; }
  .stack { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0369a1; }
  .flow { stroke: #0369a1; stroke-width: 2; stroke-dasharray: 4 5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
