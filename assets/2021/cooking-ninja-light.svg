<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">Cooking Ninja: A recipe book you can search and add to.</title>
<desc id="d">Recipes stream in live from Firestore. Add recipes with ingredients, method, time and an image. Search recipes from the navbar. Delete a recipe straight from its card. Three accent colours and a dark mode.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effaf7"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="ac" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
</defs>
<style>
  .eyebrow { font: 600 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .12em; fill: #0f766e; }
  .title { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #10201d; letter-spacing: -.01em; }
  .sub { font: 400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4b635e; }
  .feat { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #10201d; }
  .lane { font: 600 10px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .14em; fill: #4b635e; }
  .chip { font: 500 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #0f3d38; }
  .stack { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #0f766e; }
  .flow { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 4 5; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
